name: prescription_normalizer
description: Application de dictée médicale avec transcription vocale offline.
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dart_phonetics: ^1.0.1
  google_fonts: ^7.1.0
  path_provider: ^2.1.5
  record: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  whisper_flutter_new: ^1.0.1

dependency_overrides:
  whisper_flutter_new:
    path: packages/whisper_flutter_new

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
